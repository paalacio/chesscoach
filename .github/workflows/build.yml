# Tests on every push/PR, then builds the app for macOS (Apple Silicon) and
# Windows and uploads the installers as workflow artifacts (Actions tab → run →
# Artifacts). A version tag (v1.0.0, ...) also attaches them to a *draft* GitHub
# release, which stays private until it's published on GitHub.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"] # notes-only changes don't need a 25-minute build
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 12.23.0
  NODE_VERSION: 26

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # Tauri needs the sidecar binary to exist even to compile the tests.
      - run: pnpm fetch-stockfish
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm exec playwright install webkit chromium
      - run: pnpm test:e2e --grep-invert @screenshot
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  build:
    needs: test
    permissions:
      contents: write # to create the draft release on version tags
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: windows-latest
            args: ""
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch-stockfish --target ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # On a version tag: a draft release with the installers. Otherwise: build only.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Tung Tung Chessahur ${{ github.ref_name }}"
          releaseBody: "Installers for macOS (Apple Silicon) and Windows. How to install and set up: see the README."
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "TungTungChessahur-[platform]-[arch]-[bundle]"
